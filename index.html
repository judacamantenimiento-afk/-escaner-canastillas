<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escanear Canastilla - Enviaseo</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --verde:#8CBE2A; --naranja:#EE7D00; --gris:#706F6F;
    --bg:#f4f5f2; --card:#ffffff; --ok:#8CBE2A; --danger:#e5484d;
    --text:#3a3a3a; --muted:#8a8a8a; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; padding-bottom:40px;}
  header{padding:16px 20px; background:#fff; border-bottom:3px solid var(--naranja); text-align:center;}
  header img{max-width:150px; height:auto;}

  .card{max-width:420px; margin:24px auto; background:var(--card); border-radius:var(--radius); padding:24px; box-shadow:0 4px 20px rgba(0,0,0,.06); border:1px solid rgba(0,0,0,.04);}
  h1{font-size:18px; margin:0 0 4px; color:var(--gris);}
  p.sub{color:var(--muted); font-size:13px; margin:0 0 20px;}
  label{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
  input{width:100%; padding:12px 14px; margin:6px 0 16px; border-radius:10px; border:1px solid #e2e2e2; background:#fafafa; font-size:15px;}
  input:focus{outline:none; border-color:var(--naranja); background:#fff;}
  button.primary{width:100%; padding:14px; border:none; border-radius:10px; background:var(--naranja); color:#fff; font-weight:700; font-size:15px; cursor:pointer;}
  button.primary:disabled{opacity:.4;}
  button.secondary{width:100%; margin-top:8px; padding:12px; border-radius:10px; background:transparent; color:var(--muted); border:1px solid #ddd; font-size:13px; cursor:pointer;}
  .msg{margin-top:14px; font-size:13px; padding:10px 12px; border-radius:8px;}
  .msg.ok{background:rgba(140,190,42,.12); color:#5c8317;}
  .msg.err{background:rgba(229,72,77,.1); color:var(--danger);}

  .saludo{max-width:420px; margin:16px auto 0; background:linear-gradient(120deg, var(--verde), #a4d354); border-radius:var(--radius); padding:16px 20px; color:#fff;}
  .saludo h2{font-size:16px; margin:0;}
  .stats{max-width:420px; margin:12px auto 0; display:flex; gap:10px;}
  .stat{flex:1; background:var(--card); border-radius:12px; padding:12px 8px; text-align:center; border:1px solid rgba(0,0,0,.04);}
  .stat .n{font-size:20px; font-weight:700; color:var(--gris);}
  .stat .l{font-size:10px; color:var(--muted); text-transform:uppercase;}
  .stat.done .n{color:var(--verde);}
  .stat.pend .n{color:var(--naranja);}

  #reader{max-width:420px; margin:16px auto 0; border-radius:14px; overflow:hidden;}
  .scan-result{max-width:420px; margin:10px auto 0; padding:12px 14px; border-radius:10px; background:#fff; font-size:14px; border:1px solid rgba(0,0,0,.05);}
  .photos{max-width:420px; margin:12px auto 0; display:flex; gap:10px;}
  .photo-slot{flex:1; aspect-ratio:1; border:2px dashed #d8d8d8; border-radius:10px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; background:#fafafa;}
  .photo-slot img{width:100%; height:100%; object-fit:cover;}
  .photo-slot span{color:var(--muted); font-size:12px; text-align:center; padding:8px;}
  .photo-slot input{position:absolute; inset:0; opacity:0; cursor:pointer;}

  .hidden{display:none !important;}
  a.logout{display:block; text-align:center; color:var(--muted); font-size:12px; margin-top:16px; text-decoration:none;}
</style>
</head>

  <div class="scan-result" id="scanResult">Apunta la cámara al código QR de la canastilla.</div>

  <div class="photos" id="photos" style="display:none;">
    <label class="photo-slot" id="slot1"><span>Foto 1</span><input type="file" accept="image/*" capture="environment" onchange="cargarFoto(event,1)"></label>
    <label class="photo-slot" id="slot2"><span>Foto 2</span><input type="file" accept="image/*" capture="environment" onchange="cargarFoto(event,2)"></label>
  </div>
  <div class="card" style="margin-top:12px;" id="cardEnviar" style="display:none;">
    <button class="primary" id="btnEnviar" onclick="enviar()" disabled>Enviar recolección</button>
    <button class="secondary" onclick="cancelarRegistro()">Cancelar / escanear otra</button>
    <div class="msg" id="msgEnviar"></div>
    <div id="botonesDespuesDeEnviar" style="display:none; margin-top:10px;">
      <button class="primary" onclick="escanearOtra()">📷 Escanear otra canastilla</button>
      <button class="secondary" onclick="volverAlPanel()">⬅️ Volver al panel del operario</button>
    </div>
  </div>

  <a class="logout" href="#" onclick="cerrarSesion()">Cerrar sesión</a>
</div>

<script>
  // ⚠️ EDITA ESTA LÍNEA: pega la URL de tu app publicada (termina en /exec)
  const EXEC_URL = 'https://script.google.com/macros/s/AKfycbx2DFFMnFTRc_lZ9L82KnimuxnHRX7zndEFfgIjvkrHLcztn_PC_RJ0FBPFwgT1SmHtDQ/exec';
  const URL_PANEL_OPERARIO = EXEC_URL + '?page=operario';

  let usuario = null;
  let qrDetectado = null;
  let foto1 = null, foto2 = null;
  let scanner = null;
  let canastillasHoyCache = [];

  function llamarApi(payload){
    return fetch(EXEC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita el preflight CORS
      body: JSON.stringify(payload)
    }).then(r => r.json());
  }

  (function init(){
    try{ usuario = JSON.parse(localStorage.getItem('escaner_usuario')); }catch(e){}
    if(usuario) mostrarPanelEscaner();
  })();

  function iniciarSesion(){
    const u = document.getElementById('loginUsuario').value.trim();
    const p = document.getElementById('loginPassword').value;
    const msgEl = document.getElementById('msgLogin');
    msgEl.innerHTML = '';
    if(!u || !p){ msgEl.innerHTML = '<div class="msg err">Completa usuario y contraseña.</div>'; return; }

    llamarApi({ action:'login', usuario:u, password:p }).then(res => {
      if(!res.ok){ msgEl.innerHTML = '<div class="msg err">' + res.mensaje + '</div>'; return; }
      if(res.usuario.rol !== 'operario'){ msgEl.innerHTML = '<div class="msg err">Esta app es solo para operarios.</div>'; return; }
      usuario = res.usuario;
      localStorage.setItem('escaner_usuario', JSON.stringify(usuario));
      mostrarPanelEscaner();
    }).catch(err => { msgEl.innerHTML = '<div class="msg err">Error de conexión: ' + err.message + '</div>'; });
  }

  function cerrarSesion(){
    localStorage.removeItem('escaner_usuario');
    location.reload();
  }

  function mostrarPanelEscaner(){
    document.getElementById('vistaLogin').classList.add('hidden');
    document.getElementById('vistaEscaner').classList.remove('hidden');
    const hora = new Date().getHours();
    let saludo = 'Buenos días';
    if(hora >= 12 && hora < 19) saludo = 'Buenas tardes';
    else if(hora >= 19 || hora < 5) saludo = 'Buenas noches';
    document.getElementById('saludoTexto').textContent = saludo + ', ' + (usuario.nombre_completo || usuario.usuario).split(' ')[0] + ' 👋';
    cargarEstado();
    iniciarScanner();
  }

  function cargarEstado(){
    llamarApi({ action:'estado', usuario: usuario.usuario }).then(res => {
      document.getElementById('stTotal').textContent = res.total;
      document.getElementById('stDone').textContent = res.recogidas;
      document.getElementById('stPend').textContent = res.pendientes;
      canastillasHoyCache = res.canastillas || [];
    });
  }

  function iniciarScanner(){
    scanner = new Html5Qrcode('reader');
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 230 },
      (decodedText) => {
        qrDetectado = decodedText;
        mostrarConfirmacion();
      },
      () => {}
    ).catch(err => {
      document.getElementById('scanResult').innerHTML = '⚠️ No se pudo abrir la cámara: ' + err;
    });
  }

  function mostrarConfirmacion(){
    scanner.pause();
    const idBuscado = String(qrDetectado).replace('CANASTILLA-', '');
    const c = canastillasHoyCache.find(x => String(x.id_canastilla) === idBuscado);
    const el = document.getElementById('scanResult');
    if(c){
      // Ya la conocíamos de la lista de hoy: mostramos su dirección/ruta
      el.innerHTML = '✅ <b>' + (c.direccion || 'Canastilla ' + c.id_canastilla) + '</b>' +
        (c.ruta_del_dia ? ' · Ruta ' + c.ruta_del_dia : '') +
        (c.estado_dia === 'recogida' ? '<br><span style="color:var(--danger);">⚠️ Ya fue registrada hoy.</span>' : '');
    } else {
      // No estaba en la lista de hoy (no se había generado asignación, o no era su día) —
      // igual se puede registrar, el servidor la acepta si existe y está activa.
      el.innerHTML = '✅ Código detectado: <b>' + qrDetectado + '</b>. Sube las fotos y envía para registrarla.';
    }
    document.getElementById('photos').style.display = 'flex';
    document.getElementById('cardEnviar').style.display = 'block';
  }

  // Reduce el tamaño de la foto antes de enviarla (mucho más rápido de subir sin perder calidad visible)
  function comprimirImagen(dataUrl, callback){
    const img = new Image();
    img.onload = function(){
      const maxAncho = 1000;
      const escala = Math.min(1, maxAncho / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * escala;
      canvas.height = img.height * escala;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = dataUrl;
  }

  function cargarFoto(ev, n){
    const file = ev.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(e){
      comprimirImagen(e.target.result, function(comprimida){
        if(n===1){ foto1 = comprimida; document.getElementById('slot1').innerHTML = '<img src="'+foto1+'"><input type="file" accept="image/*" capture="environment" onchange="cargarFoto(event,1)">'; }
        else{ foto2 = comprimida; document.getElementById('slot2').innerHTML = '<img src="'+foto2+'"><input type="file" accept="image/*" capture="environment" onchange="cargarFoto(event,2)">'; }
        document.getElementById('btnEnviar').disabled = !(qrDetectado && foto1 && foto2);
      });
    };
    reader.readAsDataURL(file);
  }

  function enviar(){
    const btn = document.getElementById('btnEnviar');
    btn.disabled = true; btn.textContent = 'Enviando... (puede tardar unos segundos)';
    const datos = { codigo_qr: qrDetectado, operario: usuario.usuario, imagen1Base64: foto1, imagen2Base64: foto2 };

    function mandar(lat, lng){
      datos.latitud = lat; datos.longitud = lng;
      llamarApi({ action:'registrar', datos: datos }).then(res => {
        const msgEl = document.getElementById('msgEnviar');
        if(res.ok){
          msgEl.innerHTML = '<div class="msg ok">' + res.mensaje + '</div>';
          if(scanner) scanner.stop().catch(()=>{});
          document.getElementById('reader').innerHTML = '';
          document.getElementById('btnEnviar').style.display = 'none';
          document.querySelector('#cardEnviar .secondary').style.display = 'none';
          document.getElementById('botonesDespuesDeEnviar').style.display = 'block';
          cargarEstado();
        } else {
          msgEl.innerHTML = '<div class="msg err">' + res.mensaje + '</div>';
          btn.disabled = false; btn.textContent = 'Enviar recolección';
        }
      }).catch(err => {
        document.getElementById('msgEnviar').innerHTML = '<div class="msg err">Error de conexión: ' + err.message + '</div>';
        btn.disabled = false; btn.textContent = 'Enviar recolección';
      });
    }

    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(pos => mandar(pos.coords.latitude, pos.coords.longitude), () => mandar('', ''));
    } else { mandar('', ''); }
  }

  function escanearOtra(){
    document.getElementById('botonesDespuesDeEnviar').style.display = 'none';
    document.getElementById('btnEnviar').style.display = 'block';
    document.querySelector('#cardEnviar .secondary').style.display = 'block';
    document.getElementById('msgEnviar').innerHTML = '';
    cancelarRegistro();
    iniciarScanner();
  }

  function volverAlPanel(){
    window.location.href = URL_PANEL_OPERARIO;
  }

  function cancelarRegistro(){
    qrDetectado = null; foto1 = null; foto2 = null;
    document.getElementById('photos').style.display = 'none';
    document.getElementById('cardEnviar').style.display = 'none';
    document.getElementById('slot1').innerHTML = '<span>Foto 1</span><input type="file" accept="image/*" capture="environment" onchange="cargarFoto(event,1)">';
    document.getElementById('slot2').innerHTML = '<span>Foto 2</span><input type="file" accept="image/*" capture="environment" onchange="cargarFoto(event,2)">';
    document.getElementById('btnEnviar').disabled = true;
    document.getElementById('btnEnviar').textContent = 'Enviar recolección';
    document.getElementById('scanResult').textContent = 'Apunta la cámara al código QR de la canastilla.';
    try{ if(scanner) scanner.resume(); }catch(e){ /* si el escáner ya se había detenido, no pasa nada */ }
  }
</script>
</body>
</html>
